# Every option in use.
name: echo
owner: mario
image:
  repository: zot.clockmost.com/meru/echo
  digest: sha256:5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f
  tag: 3f2c1ab
replicas: 2
port: 9000
clusterIP: 10.43.0.200
extraPorts:
  - name: ssh
    port: 2222
    nodePort: 30222
command: [python]
args: [-m, echo]
env:
  LOG_LEVEL: info
secretEnv:
  PGPASSWORD:
    secret: echo-db-runtime
    key: password
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  path: /backlog
  valueLocation: backlog
  targetValue: 5
certificate:
  enabled: true
  duration: 12h
  renewBefore: 4h
  mountPath: /var/run/meru/tls
openbaoLogin:
  enabled: true
  mountPath: /var/run/meru/openbao
kubernetesApi:
  enabled: true
  mountPath: /var/run/meru/kubernetes
authentikLogin:
  enabled: true
  mountPath: /var/run/meru/authentik
externalSecrets:
  echo-db-runtime:
    type: kubernetes.io/basic-auth
  echo-api-keys: {}
  echo-config:
    mountPath: /etc/echo
    files:
      config.yaml: |
        client_secret: {{ .client_secret }}
heartbeat:
  scheme: HTTPS
  readyPath: /ready
migrate:
  enabled: true
  command: [.venv/bin/alembic]
  args: [upgrade, head]
  env:
    LOG_LEVEL: debug
  secretEnv:
    PGPASSWORD:
      secret: echo-db-app
      key: password
  timeoutSeconds: 300
persistence:
  - name: data
    mountPath: /data
    size: 1Gi
  - name: archive
    mountPath: /archive
    size: 10Gi
    storageClass: hdd
otel:
  endpoint: http://openobserve.example:5081/api/default
configMaps:
  - name: echo-feed
    mountPath: /data/feed
networkPolicy:
  enabled: true
  fromNamespaces: [janus, keda]
