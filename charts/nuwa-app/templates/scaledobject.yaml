{{- if and .Values.autoscaling.enabled (include "nuwa-app.runs" .) }}
{{- with .Values.autoscaling }}
{{- if gt (int .minReplicas) (int .maxReplicas) }}
{{- fail "autoscaling.minReplicas is above maxReplicas" }}
{{- end }}
{{- end }}
# KEDA scales the Deployment on the app's own backlog (D75): it polls the app's Service inside the cluster and drives
# an HPA it creates. The Deployment leaves `replicas` out, so Argo CD and the HPA don't fight over it.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "nuwa-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ .Values.name }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.cooldownPeriod }}
  triggers:
    - type: metrics-api
      metadata:
        url: http://{{ .Values.name }}.{{ .Release.Namespace }}.svc{{ .Values.autoscaling.path }}
        format: json
        valueLocation: {{ .Values.autoscaling.valueLocation | quote }}
        targetValue: {{ .Values.autoscaling.targetValue | quote }}
{{- end }}
