apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "nuwa-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    # A volume is ReadWriteOnce on one node: the old pod has to let go before the new one mounts it.
    type: {{ if .Values.persistence }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels:
      {{- include "nuwa-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nuwa-app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      # Pod Security "restricted" (rule 4), spelled out so the pod passes it whatever the image does.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        fsGroup: {{ .Values.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ include "nuwa-app.image" . }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.name }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace={{ .Release.Namespace }},meru.owner={{ .Values.owner }}
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- include "nuwa-app.secretEnv" .Values.secretEnv | nindent 12 }}
          # Rule 6: the platform knows when the app is up (startup), alive (liveness) and serving (readiness).
          startupProbe:
            httpGet:
              path: {{ .Values.heartbeat.path }}
              port: http
            periodSeconds: 2
            timeoutSeconds: {{ .Values.heartbeat.timeoutSeconds }}
            failureThreshold: {{ .Values.heartbeat.startupFailureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.heartbeat.path }}
              port: http
            periodSeconds: {{ .Values.heartbeat.periodSeconds }}
            timeoutSeconds: {{ .Values.heartbeat.timeoutSeconds }}
            failureThreshold: {{ .Values.heartbeat.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.heartbeat.readyPath | default .Values.heartbeat.path }}
              port: http
            periodSeconds: {{ .Values.heartbeat.periodSeconds }}
            timeoutSeconds: {{ .Values.heartbeat.timeoutSeconds }}
            failureThreshold: 1
          # Rule 5.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if or .Values.tmp.enabled .Values.persistence .Values.certificate.enabled }}
          volumeMounts:
            {{- if .Values.tmp.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- range .Values.persistence }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- if .Values.certificate.enabled }}
            - name: tls
              mountPath: {{ .Values.certificate.mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.tmp.enabled .Values.persistence .Values.certificate.enabled }}
      volumes:
        {{- if .Values.tmp.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        {{- end }}
        {{- range .Values.persistence }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ $.Values.name }}-{{ .name }}
        {{- end }}
        {{- if .Values.certificate.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.name }}-tls
            defaultMode: 0400
        {{- end }}
      {{- end }}
