{{- if and (include "nuwa-app.runs" .) (not .Values.job.schedule) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "nuwa-app.labels" . | nindent 4 }}
  {{- if .Values.reloadsSecrets }}
  annotations:
    meru.clockmost.com/reloads-secrets: "true" # Kyverno's restart-on-secret-change skips it
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    # A volume is ReadWriteOnce on one node: the old pod has to let go before the new one mounts it.
    type: {{ if .Values.persistence }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels:
      {{- include "nuwa-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nuwa-app.podLabels" . | nindent 8 }}
    spec:
      {{- include "nuwa-app.podSpec" . | nindent 6 }}
{{- end }}
