apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "nuwa-app.labels" . | nindent 4 }}
spec:
  {{- with .Values.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "nuwa-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
