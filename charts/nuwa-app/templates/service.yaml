{{- if not .Values.job.schedule }}
{{- /* A scheduled app (job.schedule) serves nothing: no Service. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "nuwa-app.labels" . | nindent 4 }}
spec:
  {{- if .Values.extraPorts }}
  type: NodePort
  {{- end }}
  {{- with .Values.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "nuwa-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- range .Values.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      nodePort: {{ .nodePort }}
    {{- end }}
{{- end }}
