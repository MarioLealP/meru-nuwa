{{- if .Values.networkPolicy.enabled }}
# Who may open connections to the app's pods (enforced since 2026-11-01, workspace bead cm-ayc6). Everything not
# listed is refused - other apps' pods, CI jobs - so an app that trusts a header Caddy sets can't be reached around
# Caddy from inside the cluster. fromHost: the node (kubelet probes) and, until Caddy and Gitea are pods (D24), Docker's
# range they come from.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "nuwa-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nuwa-app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.networkPolicy.fromHost }}
    - from:
        {{- range .Values.networkPolicy.hostAddresses }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.fromNamespaces }}
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ toJson . }}
    {{- end }}
{{- end }}
