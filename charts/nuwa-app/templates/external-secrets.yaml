{{- if .Values.externalSecrets }}
{{- $ns := .Release.Namespace }}
{{- range $name, $_ := .Values.migrate.secretEnv }}
{{- if hasKey $.Values.externalSecrets .secret }}
{{- fail (printf "migrate.secretEnv.%s: %s is filled by ESO in the Sync phase, after the PreSync migration - a first install would wait forever. Migrations use Secrets that exist before the sync (CNPG's)." $name .secret) }}
{{- end }}
{{- end }}
{{- /*
Secrets from OpenBao (D66): ESO logs in as this namespace's `eso` account through the shared role meru-eso (D71:
OpenBao fills in the namespace from the login, so it reads apps/meru/<namespace>/eso/* only) and writes each Secret,
owning it (D68). The account and store at wave -2, the Secrets at -1: a store created in the same wave isn't ready
for the first try. Argo waits until they're filled before the Deployment rolls out.
*/}}
# The identity ESO borrows to log in to OpenBao. No pod runs as it; no API token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso
  labels:
    {{- include "nuwa-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    {{- include "nuwa-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: {{ .Values.openbao.addr }}
      path: apps
      version: v2
      caBundle: {{ .Values.openbao.caCert | b64enc }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: meru-eso
          serviceAccountRef:
            name: eso
            audiences: [openbao]
{{- range $name, $secret := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nuwa-app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $.Values.openbao.refreshInterval }}
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
    {{- if or $secret.type $secret.files }}
    template:
      {{- with $secret.type }}
      type: {{ . }}
      {{- end }}
      {{- with $secret.files }}
      engineVersion: v2
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  dataFrom:
    - extract:
        key: meru/{{ $ns }}/eso/{{ $name }}
{{- end }}
{{- end }}
