# Every Meru app is one deploy/values.yaml against this chart. values.schema.json rejects typos and missing fields.

# Who the app is - these become the CMDB labels every resource carries.
name: "" # required; app.kubernetes.io/name, also the resource names
owner: "" # required; meru.clockmost.com/owner (a person or team)
partOf: meru # app.kubernetes.io/part-of
# false = retired (D84): the workload stops (no Deployment / migration Job / ScaledObject); the rest stays until Charon
# purges it. Shikigami sets it in the app's last commit before archiving the repo.
enabled: true

image:
  repository: "" # required, e.g. zot.clockmost.com/meru/echo
  digest: "" # required, sha256:... - what actually runs
  tag: "" # optional, shown next to the digest for humans (the commit SHA)

replicas: 1 # ignored while autoscaling is on - KEDA owns the count then

# A scheduled job instead of a long-running service (D107): `schedule` set = a CronJob, no Deployment, no Service,
# no port or probes. The pod is otherwise the same (rules, secrets, OpenBao/Kubernetes logins). Zabbix watches the
# CronJob's last successful run.
job:
  schedule: "" # cron, e.g. "30 3 * * *"; empty = a long-running Deployment
  timeZone: Europe/Lisbon
  backoffLimit: 2 # retries of a failed run before the run counts as failed
  activeDeadlineSeconds: 3600 # a run is stopped after this

# The port the app listens on. The Service exposes it as port 80.
port: 8080

# A fixed Service address, for callers outside the cluster that can't use its DNS name (e.g. Gitea's webhook).
# Only from the static band 10.43.0.2-10.43.0.255 (Kubernetes assigns automatic addresses from the rest, so these
# never collide); taken: .1 API, .10 DNS, .50 Zot, .60 Shikigami. Empty = Kubernetes picks. Changing it on a live
# Service means deleting the Service once (the address can't change in place).
clusterIP: ""
# Ports that aren't the app's HTTP, reached from outside the cluster on the node (Caddy only forwards HTTP). Any entry
# makes the Service a NodePort, and the node's firewall still has to let it in. The port's traffic reaches the pod from
# the node's address, so a networkPolicy needs fromHost.
extraPorts: []
#  - name: ssh
#    port: 2222
#    nodePort: 30222

# Every app answers GET /heartbeat with 200 when it's alive. Startup gets longer grace than liveness.
heartbeat:
  path: /heartbeat
  scheme: HTTP # HTTPS for an app that only serves TLS; the kubelet doesn't check the certificate
  host: "" # the Host header the probes send, for an app that refuses other hosts (Django's ALLOWED_HOSTS); default: the pod's IP
  readyPath: "" # readiness, when the app has its own "can serve" check (e.g. its database answers); default: path
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  startupFailureThreshold: 30

command: []
args: []

# Plain settings, name -> value. Secrets never go here.
env: {}

# Settings from Kubernetes Secrets, name -> {secret, key}: one of externalSecrets below, or one another part makes
# (CNPG's <db>-app login).
secretEnv: {}
#  PGPASSWORD:
#    secret: myapp-db-runtime
#    key: password

# Secrets ESO fills from OpenBao (D66), name -> settings. The values live at apps/meru/<namespace>/eso/<name> and
# every key there becomes a key of the Secret. Shikigami writes them.
externalSecrets: {}
#  myapp-db-runtime:
#    type: kubernetes.io/basic-auth # optional, default Opaque
#  myapp-config:
#    mountPath: /etc/myapp # optional: the Secret as read-only files, for an app that can't read its secrets from the env
#    files: # optional: the Secret's keys, each a template; {{ .key }} is that key's value in OpenBao. So a config file can
#      # stay in git with only its secret in OpenBao. Without it, the keys are OpenBao's.
#      config.yaml: |
#        client_secret: {{ .client_secret }}

# Where ESO (and cert-manager, for certificate below) log in: OpenBao's Kubernetes login, shared roles meru-eso /
# meru-certs, which reach this namespace's own paths and names only (D71).
openbao:
  addr: https://openbao.clockmost.internal:8204
  refreshInterval: 5m # how often ESO re-reads; a rotation reaches files then, env vars on the next restart
  caCert: |
    -----BEGIN CERTIFICATE-----
    MIIBuDCCAT+gAwIBAgIUdhEX2D6QMvASBtSG0Umvg6/82bUwCgYIKoZIzj0EAwMw
    HDEaMBgGA1UEAwwRY2xvY2ttb3N0IHJvb3QgQ0EwHhcNMjYxMDA2MTU1MjI0WhcN
    MzYxMDAzMTU1MjI0WjAcMRowGAYDVQQDDBFjbG9ja21vc3Qgcm9vdCBDQTB2MBAG
    ByqGSM49AgEGBSuBBAAiA2IABN2sR4GnlMH7p+qg3gcNQdsrIyOCzDJPfpkD4H/q
    weqXGlXsiibzoiaX3855xGxNBF1nH9vVFjhNzPtvfDjhRgVsMsmTl4poKH0P1NSr
    aLWd9L0vl4hwRY+i5UDbPWem5aNCMEAwDwYDVR0TAQH/BAUwAwEB/zAOBgNVHQ8B
    Af8EBAMCAQYwHQYDVR0OBBYEFMUwLEQ5E7i14+RsAQu6ySK4zFxUMAoGCCqGSM49
    BAMDA2cAMGQCMCfjfJs7vE8EO+vCmTw2l4QFYuv1TH1YUjFwedPpvjkTxe1jgYVV
    EEmyXqPSoqB3mgIwMiP0/1G6XFRxMT+hHj16+uOjv6l3nqPuUWomsOQakPF5i51U
    AwqvzZjfzlr4WU9o
    -----END CERTIFICATE-----

# A TLS certificate for the app's in-cluster names, <name>.<namespace>.svc and .svc.cluster.local (D71), from
# OpenBao's pki_meru through cert-manager, which renews it before it expires. Usable as server and as client (mTLS,
# e.g. to Temporal). Mounted read-only at mountPath: tls.crt, tls.key, ca.crt; a renewal replaces the files in
# place, so the app re-reads them when it (re)connects.
certificate:
  enabled: false
  duration: 24h
  renewBefore: 8h
  mountPath: /var/run/meru/tls
  keyEncoding: "" # PKCS8 for a server that only reads that (granian: GlitchTip); default: cert-manager's own (PKCS1/SEC1)

# The app's own OpenBao login, for an app that writes to OpenBao itself (Shikigami, D79) - everyone else reads through
# externalSecrets above. Mounted read-only at mountPath: `token`, a service-account token meant for OpenBao only
# (audience openbao, 10 minutes, the kubelet swaps in a fresh one before it runs out), and `ca.crt`, OpenBao's CA.
# The app logs in at <openbao.addr>/v1/auth/kubernetes/login with the role OpenBao's admin bound to this service
# account; without such a role the token opens nothing.
openbaoLogin:
  enabled: false
  mountPath: /var/run/meru/openbao

# The app's own Authentik login (D104), for an app that calls a Meru service with Authentik tokens (Thoth, Temporal):
# no app password - the pod sends this token as its client_credentials assertion and Authentik checks it against the
# cluster's signing key. Mounted read-only at mountPath: `token`, a service-account token meant for Authentik only
# (audience authentik, 1 hour, the kubelet swaps in a fresh one before it runs out). It opens only what a protected
# Authentik blueprint grants `<namespace>/<service account>` (a group's k8s_workloads); without a grant, nothing.
authentikLogin:
  enabled: false
  mountPath: /var/run/meru/authentik

# The app's own Kubernetes API token, for an app that reads the cluster itself (Shikigami reads Argo CD Applications,
# D85) - every other pod has none (automountServiceAccountToken stays false). Mounted read-only at mountPath: `token`,
# a service-account token for the API server (10 minutes, renewed by the kubelet), and `ca.crt`, the cluster's CA. It
# can do only what RBAC grants this service account - by default nothing; Meru/meru's rbac/ holds each exact grant.
kubernetesApi:
  enabled: false
  mountPath: /var/run/meru/kubernetes

# Scale on the app's own backlog with KEDA (D75): KEDA polls GET <path> on the app's Service from inside the cluster
# (no credentials) and keeps one replica per `targetValue` waiting items, between min and max. The app answers JSON
# with the number at `valueLocation`, e.g. {"backlog": 12}. Stateless apps only - every replica must be able to take
# any work.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  path: /backlog
  valueLocation: backlog
  targetValue: 5
  pollingInterval: 30 # seconds between polls
  cooldownPeriod: 300 # seconds of no backlog before scaling down to minReplicas

# Database migrations before every rollout: a Job from the same image, run by Argo CD as a PreSync hook - if it
# fails, the sync stops and the old version keeps serving. It gets the app's env plus its own; its secretEnv is its
# own only (migrations usually log in as the schema owner, the app as a lesser role).
migrate:
  enabled: false
  command: []
  args: []
  env: {}
  secretEnv: {}
  timeoutSeconds: 600

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# The image must run as a numeric non-root user; this is the one Kubernetes enforces.
runAsUser: 10001

# Writable scratch at /tmp - the root filesystem is read-only.
tmp:
  enabled: true
  sizeLimit: 64Mi

# true for an app that picks up new secret files itself: a rotated Secret then doesn't restart it (Kyverno's
# restart-on-secret-change skips it). For an app where a restart costs something, like Warpgate's open sessions.
reloadsSecrets: false

# Persistent volumes. storageClass: local (SSD, default) or hdd. Any volume switches rollouts to Recreate.
persistence: []
#  - name: data
#    mountPath: /data
#    size: 1Gi
#    storageClass: local

# ConfigMaps something outside the chart keeps up to date (e.g. a host job pushing data files), mounted read-only;
# each key is a file. Optional: the pod starts before the first one exists, and the files appear when it does
# (kubelet refreshes mounted ConfigMaps within about a minute).
configMaps: []
#  - name: atlas-live
#    mountPath: /data/live

# Who may connect to the app (a NetworkPolicy; off = anyone in the cluster). On, only the host side and the
# namespaces listed get in - other apps' pods and CI jobs don't.
networkPolicy:
  enabled: false
  fromHost: true
  # The host side: the node itself (the kubelet's probes, from its cni0 address) and Docker's range - Caddy and
  # Gitea are still compose containers, and the policy sees their container address (Docker rewrites it only
  # afterwards). Temporary: once they're pods (D24) this becomes "from namespace caddy / gitea".
  hostAddresses: [10.42.0.1/32, 172.16.0.0/12]
  fromNamespaces: [] # e.g. [janus] for an app Janus calls
  # Connections the pods may open: allow = anything (most apps call Thoth, Temporal, OpenBao, ...); none = nothing,
  # not even DNS - for an app that only answers, like a static site. Only with enabled.
  egress: allow

# Traces go to OpenObserve. The chart names the service; the exporter endpoint is set once the app has its
# OpenObserve credentials (Infisical).
otel:
  enabled: true
  endpoint: ""

# Crash reports to GlitchTip (D125): the app's DSN, which Shikigami writes here at onboarding. Plain config, not a
# secret - the key only sends reports, and GlitchTip is LAN + VPN only. Set: the pod gets SENTRY_DSN, which the Sentry
# SDK reads. Empty: no SENTRY_DSN, the SDK stays off.
glitchtip:
  dsn: ""
